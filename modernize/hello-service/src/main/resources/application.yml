server:
  # Default to a port that won't collide with the gateway (8080) or
  # auth-center (8081). Override with PORT env var.
  port: ${PORT:8082}
  shutdown: graceful

spring:
  application:
    name: hello-service
  main:
    banner-mode: off
  webflux:
    base-path: /

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    # The dynamic route locator in api-gateway lower-cases the
    # service id to build the path prefix, so
    # "hello-service" → /hello-service/** → lb://HELLO-SERVICE
    # (case-insensitive in Eureka).
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.co.eurekatic: INFO
    reactor.netty: INFO
